<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Événements</title>
</head>
<body>
  <section class="objects">

    <div class="event">

      <!-- enventDate : date d'ouverture -->
      <time class="eventOpenDate" datetime="2026-10-23"></time>

      <!-- eventType : rue / adresse (comme dans ton code) -->
      <h2 class="eventType"></h2>

      <!-- eventTitle : titre -->
      <h1 class="eventTitle"></h1>

      <!-- eventDescriptif : description -->
      <p class="eventDescriptif"></p>

      <!-- eventdateTime : début et fin -->
      <time class="eventDateTime" datetime="2026-10-23"></time>

      <!-- eventPrice : prix -->
      <span class="eventPrice"></span>

      <!-- eventAddress : adresse -->
      <p class="eventAddress"></p>

      <!-- eventContact : contact -->
      <p class="eventContact"></p>

      <!-- eventDistance : lien carte / distance -->
      <a class="eventDistance"></a>

    </div>

  </section>
  <script src="modal-event.js"></script>
</body>
</html>
